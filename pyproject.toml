[project]
name = "stillsane"
dynamic = ["version"]
description = "Know when your LLM app quietly stops working."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sanket Marathe" }]
keywords = [
    "llm",
    "drift",
    "monitoring",
    "evals",
    "observability",
    "regression-testing",
    "agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # The local embedding model, and a hard dependency rather than an extra: the
    # default config asks for it, so shipping it as optional meant a plain
    # `pip install stillsane` produced a tool that failed on its first command.
    # It pulls in no torch.
    "model2vec>=0.3",
]

[project.optional-dependencies]
# Kept as a no-op alias so `pip install 'stillsane[semantic]'` still resolves for
# anyone who followed the 0.0.2 instructions.
semantic = ["model2vec>=0.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
stillsane = "stillsane.cli:main"

[project.urls]
Homepage = "https://github.com/msanket9/stillsane"
Repository = "https://github.com/msanket9/stillsane"
Issues = "https://github.com/msanket9/stillsane/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/stillsane/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stillsane"]

[tool.hatch.build.targets.sdist]
# Ship the tests: they are the argument that the variance model works, and a
# source distribution nobody can verify is worth less than one they can.
include = ["src/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run stays offline and free: no network, no API key, no model
# download. `pytest -m network` opts into the tests that fetch the embedding
# model, and CI runs both.
addopts = "-m 'not network'"
markers = [
    "network: needs internet (downloads the embedding model on first run)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# ISC would flag the deliberately wrapped fixture strings in tests/conftest.py,
# where the line breaks are there to keep the scenario texts readable.
ignore = ["E501"]
